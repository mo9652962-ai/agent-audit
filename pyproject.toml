[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 发行名用 agent-env-audit（PyPI 的 agent-audit 已被占用）；import 包名保持 agent_audit
name = "agent-env-audit"
version = "0.1.2"
description = "AI Agent 环境安全审计 CLI：供应链投毒 / 密钥暴露 / 端口暴露 / MCP server 一键体检"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["security", "audit", "agent", "mcp", "supply-chain", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# 运行时零依赖；PyYAML 仅用于更精确的 MCP YAML 解析（缺失时自动降级为内置解析）
[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "PyYAML>=6.0", "ruff>=0.8", "bandit>=1.8"]

[project.scripts]
agent-audit = "agent_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
